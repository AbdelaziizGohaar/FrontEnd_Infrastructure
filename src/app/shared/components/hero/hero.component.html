<div class="hero">
  <div class="hero__slides">
    @for (slide of slides; track $index) {
      <div class="hero__slide" [class.active]="currentSlide === $index">
        <div class="hero__content">
          <div class="hero__container">
            <div class="hero__text">
              <span class="hero__wood-badge" [class]="'hero__wood-badge--' + slide.woodType">
                {{ slide.woodType | uppercase }}
              </span>
              <h1 class="hero__title">{{ slide.title | translate }}</h1>
              <p class="hero__subtitle">{{ slide.subtitle | translate }}</p>
              <a routerLink="/products" class="hero__cta">
                {{ slide.cta | translate }}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                  <polyline points="12 5 19 12 12 19"/>
                </svg>
              </a>
            </div>
            <div class="hero__image">
              <img [src]="slide.image" [alt]="slide.title | translate">
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Navigation Dots -->
  <div class="hero__dots">
    @for (slide of slides; track $index) {
      <button class="hero__dot" [class.active]="currentSlide === $index" (click)="goToSlide($index)"></button>
    }
  </div>

  <!-- Navigation Arrows -->
  <button class="hero__arrow hero__arrow--prev" (click)="prevSlide()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
  <button class="hero__arrow hero__arrow--next" (click)="nextSlide()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>
</div>
